<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="crestBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFEFA"/>
      <stop offset="70%" stop-color="#F7F3E9"/>
      <stop offset="100%" stop-color="#E8E2D4"/>
    </radialGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1A6"/>
      <stop offset="40%" stop-color="#C6AD76"/>
      <stop offset="70%" stop-color="#A88E52"/>
      <stop offset="100%" stop-color="#D9C496"/>
    </linearGradient>
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#343C32" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Circle with Gold Piping -->
  <circle cx="70" cy="70" r="64" fill="url(#crestBg)" filter="url(#crestShadow)"/>
  <circle cx="70" cy="70" r="59" fill="none" stroke="url(#crestGold)" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="70" cy="70" r="56" fill="none" stroke="#74866D" stroke-width="0.8" opacity="0.6"/>

  <!-- Botanical Olive Laurel Wreath -->
  <g stroke="#74866D" stroke-width="1" fill="none" opacity="0.85">
    <path d="M 38 70 C 38 46, 50 32, 70 30 C 90 32, 102 46, 102 70 C 102 94, 90 108, 70 110 C 50 108, 38 94, 38 70"/>
  </g>
  <!-- Tiny leaves on wreath -->
  <path d="M 38 56 C 32 52, 34 46, 40 48 Z" fill="#74866D" opacity="0.8"/>
  <path d="M 44 42 C 40 36, 44 32, 48 36 Z" fill="#74866D" opacity="0.8"/>
  <path d="M 58 32 C 58 26, 64 24, 66 28 Z" fill="#C6AD76" opacity="0.9"/>
  <path d="M 102 56 C 108 52, 106 46, 100 48 Z" fill="#74866D" opacity="0.8"/>
  <path d="M 96 42 C 100 36, 96 32, 92 36 Z" fill="#74866D" opacity="0.8"/>
  <path d="M 82 32 C 82 26, 76 24, 74 28 Z" fill="#C6AD76" opacity="0.9"/>

  <!-- Intertwined Monogram A & S -->
  <text x="70" y="78" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="600" letter-spacing="1" fill="#343C32">
    A<tspan font-family="'Alex Brush', cursive" font-size="22" font-style="italic" fill="#C6AD76"> × </tspan>S
  </text>
  <circle cx="70" cy="94" r="1.5" fill="#C6AD76"/>
</svg>
