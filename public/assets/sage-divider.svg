<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 32" width="100%" height="auto" fill="none">
  <!-- Subtle line gradient -->
  <defs>
    <linearGradient id="sageLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6AD76" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C6AD76" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#74866D"/>
      <stop offset="75%" stop-color="#C6AD76" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C6AD76" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left horizontal stem line -->
  <line x1="20" y1="16" x2="150" y2="16" stroke="url(#sageLine)" stroke-width="1"/>
  <!-- Right horizontal stem line -->
  <line x1="210" y1="16" x2="340" y2="16" stroke="url(#sageLine)" stroke-width="1"/>

  <!-- Left botanical leaf pair -->
  <path d="M 125 16 C 132 10, 142 11, 145 16 C 142 21, 132 22, 125 16 Z" fill="#74866D" opacity="0.85"/>
  <path d="M 105 16 C 112 12, 118 13, 120 16 C 118 19, 112 20, 105 16 Z" fill="#889B80" opacity="0.75"/>
  <circle cx="95" cy="16" r="1.5" fill="#C6AD76"/>
  <circle cx="85" cy="16" r="1.2" fill="#C6AD76" opacity="0.6"/>

  <!-- Right botanical leaf pair -->
  <path d="M 235 16 C 228 10, 218 11, 215 16 C 218 21, 228 22, 235 16 Z" fill="#74866D" opacity="0.85"/>
  <path d="M 255 16 C 248 12, 242 13, 240 16 C 242 19, 248 20, 255 16 Z" fill="#889B80" opacity="0.75"/>
  <circle cx="265" cy="16" r="1.5" fill="#C6AD76"/>
  <circle cx="275" cy="16" r="1.2" fill="#C6AD76" opacity="0.6"/>

  <!-- Center Motif: Elegant Diamond Star -->
  <g transform="translate(180, 16)">
    <polygon points="0,-8 5,-2 8,0 5,2 0,8 -5,2 -8,0 -5,-2" fill="#C6AD76"/>
    <circle cx="0" cy="0" r="2" fill="#FFFEFA"/>
    <circle cx="-13" cy="0" r="1.6" fill="#74866D"/>
    <circle cx="13" cy="0" r="1.6" fill="#74866D"/>
  </g>
</svg>
