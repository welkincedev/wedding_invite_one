<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="waxBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#a02633"/>
      <stop offset="45%" stop-color="#721923"/>
      <stop offset="85%" stop-color="#4e0e16"/>
      <stop offset="100%" stop-color="#38080f"/>
    </radialGradient>
    <linearGradient id="goldMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="30%" stop-color="#e8ca8c"/>
      <stop offset="70%" stop-color="#c59f54"/>
      <stop offset="100%" stop-color="#9b7430"/>
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feFlood flood-color="#2a0509" flood-opacity="0.45"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Realistic organic melted wax outer edge -->
  <path d="M 60 4 
           C 74 3, 85 8, 97 18 
           C 108 28, 114 41, 115 56 
           C 116 72, 109 88, 98 100 
           C 87 111, 72 116, 57 116 
           C 42 116, 28 111, 18 100 
           C 7 88, 4 74, 4 59 
           C 4 43, 11 29, 22 18 
           C 33 8, 46 4, 60 4 Z" 
        fill="url(#waxBase)" filter="url(#waxShadow)"/>
  
  <!-- Subtle inner recessed rim with gold trim -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#e8ca8c" stroke-width="1.2" opacity="0.6"/>
  <circle cx="60" cy="60" r="43.5" fill="none" stroke="#e8ca8c" stroke-width="0.8" stroke-dasharray="2 2.5" opacity="0.8"/>
  
  <!-- Laurel / Botanical accent wreath inside seal -->
  <g stroke="url(#goldMonogram)" stroke-width="1" fill="none" opacity="0.75">
    <path d="M 32 60 C 32 40, 42 28, 60 26 C 78 28, 88 40, 88 60 C 88 80, 78 92, 60 94 C 42 92, 32 80, 32 60"/>
  </g>
  
  <!-- Central Monogram A & S -->
  <text x="60" y="68" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="2"
        fill="url(#goldMonogram)">
    A<tspan font-size="20" font-style="italic" fill="#f4e0ba"> &amp; </tspan>S
  </text>
  
  <!-- Subtle gold stars -->
  <circle cx="60" cy="32" r="1.5" fill="#f4e0ba"/>
  <circle cx="60" cy="88" r="1.5" fill="#f4e0ba"/>
</svg>
